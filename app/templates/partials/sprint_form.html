<form action="/projects/{{ project.slug }}/sprints" method="post" class="app-form sprint-form">
  <header class="app-dialog-header"><h2 id="sprint-form-heading">Add sprints</h2></header>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  {% if field_errors.form %}<p class="form-error">{{ field_errors.form }}</p>{% endif %}
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <label>Number of sprints <input type="number" name="count" min="1" max="5" required value="{{ values.count|default(1) }}"></label>
  {% if field_errors.count %}<p class="form-error">{{ field_errors.count }}</p>{% endif %}
  <div class="app-form-actions"><button class="app-secondary-button" type="button" @click="$refs.sprintForm.close()">Cancel</button><button class="app-primary-button" type="submit">Add sprints</button></div>
</form>
