services:
  web:
    build: .
    # expose, not ports: the cluster host is shared, Traefik reaches the container
    # over the Docker network. docker-compose.override.yml binds a host port locally.
    expose:
      - "8000"
    environment:
      # Referencing ${SERVICE_FQDN_WEB} is what makes Coolify route the domain here.
      APP_URL: ${SERVICE_FQDN_WEB}
      # Set in the Coolify UI. APP_HOST is the bare hostname, e.g.
      # doyoung-demo-staging.ml-capstone.cs.byu.edu. 127.0.0.1 stays in the list
      # so the healthcheck below gets past TrustedHostMiddleware.
      ALLOWED_HOSTS: '["127.0.0.1","${APP_HOST}"]'
      ALLOWED_ORIGINS: '["https://${APP_HOST}"]'
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ENVIRONMENT: development
      # Traefik terminates https with the class wildcard cert.
      SECURE_COOKIES: "true"
      DATABASE_URL: sqlite:////data/kanbanflow.db
      ATTACHMENTS_DIR: /data/attachments
      FORWARDED_ALLOW_IPS: "*"
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - kanban-data:/data
    healthcheck:
      # /health runs SELECT 1, so this fails when the database is unreachable.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      start_period: 30s
      start_interval: 2s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  # SQLite database and attachments. Staging and production each get their own.
  kanban-data:
