# Local development only. `docker compose up` auto-merges this file; Coolify runs
# with `-f docker-compose.yaml`, so nothing here reaches staging or production.
services:
  web:
    ports:
      - "8000:8000"
    environment:
      ALLOWED_HOSTS: '["127.0.0.1","localhost"]'
      ALLOWED_ORIGINS: '["http://localhost:8000"]'
      # Local is plain http, so secure cookies would never be sent back.
      SECURE_COOKIES: "false"
